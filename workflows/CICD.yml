# Prueba: sin labels. El build corre solo al abrir/actualizar la PR.
# Validate + deploy se lanzan a mano desde Actions (workflow_dispatch),
# eligiendo ahi mismo la rama objetivo (=entorno) y el nivel de tests.
name: Salesforce CI/CD (sin labels)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - FULL
      - main
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Rama objetivo a validar/desplegar (define el entorno)'
        required: true
        type: choice
        options:
          - FULL
          - main
      test_level:
        description: 'Nivel de tests'
        required: true
        type: choice
        options:
          - none
          - all
          - custom
          - relevant
        default: all
      test_names:
        description: 'Nombres de test separados por coma (solo si test_level = custom)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (generar package.xml)
    runs-on: ubuntu-latest
    container:
      image: salesforce/cli:2.130.9-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Git Safe Directory
        run: git config --global safe.directory "*"

      # En PR usamos el base branch de la propia PR.
      # En workflow_dispatch no hay PR: usamos el input target_branch como referencia de diff.
      - name: Determinar rama objetivo
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "TARGET_BRANCH=${{ github.base_ref }}" >> "$GITHUB_ENV"
          else
            echo "TARGET_BRANCH=${{ inputs.target_branch }}" >> "$GITHUB_ENV"
          fi

      - name: Fetch target branch
        run: git fetch origin "$TARGET_BRANCH":"$TARGET_BRANCH" --depth=100

      - name: Build
        run: |
          echo "Building the project (diff contra $TARGET_BRANCH)"
          sf version
          node scripts/generatePackageFromGit.mjs
          echo "==== GENERATED package.xml ===="
          cat manifest/package.xml
          sf project convert source --manifest manifest/package.xml --output-dir deploy_mdapi
          cd deploy_mdapi && zip -r package.zip .

      - name: Publicar artifacts de build
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            deploy_mdapi/package.zip
            manifest/package.xml

  validate_full:
    name: Validate · FULL
    needs: build
    if: success() && github.event_name == 'workflow_dispatch' && inputs.target_branch == 'FULL'
    runs-on: ubuntu-latest
    container:
      image: salesforce/cli:2.130.9-slim
    environment: FULL
    env:
      CLIENT_ID: ${{ secrets.ClientIdFull }}
      CERTIFICATE: ${{ secrets.Certificado }}
      SF_USERNAME: ${{ secrets.UserNameFull }}
      LOGIN_URL: https://test.salesforce.com
      ORG_USER: ${{ secrets.UserNameFull }}
      TEST_LEVEL: ${{ inputs.test_level == 'none' && 'RunSpecifiedTests' || inputs.test_level == 'all' && 'RunLocalTests' || inputs.test_level == 'custom' && 'RunSpecifiedTests' || 'RunRelevantTests' }}
      TEST_NAMES: ${{ inputs.test_level == 'none' && secrets.DummyTest || inputs.test_level == 'custom' && inputs.test_names || '' }}
      DEPLOY_ID_FILE: deploy_id_full.txt
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Descargar build-artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Login Salesforce
        shell: bash
        run: &login_script |
          printf '%s' "$CERTIFICATE" > "${RUNNER_TEMP}/server.key"
          sf org login jwt \
            -i "$CLIENT_ID" \
            -f "${RUNNER_TEMP}/server.key" \
            -o "$SF_USERNAME" \
            -a myOrg \
            -r "$LOGIN_URL"
          rm -f "${RUNNER_TEMP}/server.key"

      - name: 'Validate'
        shell: bash
        run: &validate_script |
          TEST_FLAGS=""
          if [ -n "$TEST_NAMES" ]; then
            TEST_FLAGS=$(echo "$TEST_NAMES" | tr ', ' '\n' | grep -v '^$' | sed 's/^/-t /' | tr '\n' ' ')
          fi

          set +e
          sf project deploy validate --manifest manifest/package.xml -o "$ORG_USER" -l "$TEST_LEVEL" $TEST_FLAGS --concise -w 120 2>&1 | tee deploy_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          grep -m1 "Deploy ID:" deploy_output.txt | awk '{print $3}' > "$DEPLOY_ID_FILE"

          if [ $EXIT_CODE -ne 0 ]; then
            echo "==== Validation failed - generating retrieve package from errors ===="
            node scripts/generatePackageFromErrors.mjs deploy_output.txt
            echo "==== retrieve_errors_package.xml ===="
            cat manifest/retrieve_errors_package.xml
            exit $EXIT_CODE
          fi

      - name: Publicar Deploy ID / errores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-full
          path: |
            deploy_id_full.txt
            manifest/retrieve_errors_package.xml
          if-no-files-found: ignore

  validate_prod:
    name: Validate · PROD
    needs: build
    if: success() && github.event_name == 'workflow_dispatch' && inputs.target_branch == 'main'
    runs-on: ubuntu-latest
    container:
      image: salesforce/cli:2.130.9-slim
    environment: PROD
    env:
      CLIENT_ID: ${{ secrets.ClientIdProd }}
      CERTIFICATE: ${{ secrets.Certificado }}
      SF_USERNAME: ${{ secrets.UserNameProd }}
      LOGIN_URL: https://login.salesforce.com
      ORG_USER: ${{ secrets.UserNameProd }}
      TEST_LEVEL: ${{ inputs.test_level == 'none' && 'RunSpecifiedTests' || inputs.test_level == 'all' && 'RunLocalTests' || inputs.test_level == 'custom' && 'RunSpecifiedTests' || 'RunRelevantTests' }}
      TEST_NAMES: ${{ inputs.test_level == 'none' && secrets.DummyTest || inputs.test_level == 'custom' && inputs.test_names || '' }}
      DEPLOY_ID_FILE: deploy_id_prod.txt
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Descargar build-artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Login Salesforce
        shell: bash
        run: *login_script

      - name: 'Validate'
        shell: bash
        run: *validate_script

      - name: Publicar Deploy ID / errores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-prod
          path: |
            deploy_id_prod.txt
            manifest/retrieve_errors_package.xml
          if-no-files-found: ignore

  deploy_full:
    name: Deploy · FULL
    needs: validate_full
    if: success() && github.event_name == 'workflow_dispatch' && inputs.target_branch == 'FULL'
    runs-on: ubuntu-latest
    container:
      image: salesforce/cli:2.130.9-slim
    environment: FULL
    continue-on-error: true
    env:
      CLIENT_ID: ${{ secrets.ClientIdFull }}
      CERTIFICATE: ${{ secrets.Certificado }}
      SF_USERNAME: ${{ secrets.UserNameFull }}
      LOGIN_URL: https://test.salesforce.com
      ORG_USER: ${{ secrets.UserNameFull }}
      TEST_LEVEL: ${{ inputs.test_level == 'none' && 'RunSpecifiedTests' || inputs.test_level == 'all' && 'RunLocalTests' || inputs.test_level == 'custom' && 'RunSpecifiedTests' || 'RunRelevantTests' }}
      TEST_NAMES: ${{ inputs.test_level == 'none' && secrets.DummyTest || inputs.test_level == 'custom' && inputs.test_names || '' }}
      DEPLOY_ID_FILE: deploy_id_full.txt
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Descargar Deploy ID validado
        uses: actions/download-artifact@v4
        with:
          name: validate-full

      - name: Login Salesforce
        shell: bash
        run: *login_script

      - name: 'Quick deploy con retry'
        shell: bash
        run: &deploy_script |
          DEPLOY_ID=$(cat "$DEPLOY_ID_FILE")
          echo "Quick deploying ID: $DEPLOY_ID"

          MAX_RETRIES=2
          ATTEMPT=0
          set +e
          sf project deploy quick --target-org myOrg --job-id "$DEPLOY_ID" | tee quick_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ $EXIT_CODE -eq 0 ]; then
            echo "Deploy successful on first attempt"
            exit 0
          fi

          echo "First attempt failed. Starting retries..."
          while [ $ATTEMPT -lt $MAX_RETRIES ]; do
            ATTEMPT=$((ATTEMPT+1))
            echo "=== RETRY $ATTEMPT ==="

            sf project deploy validate --manifest manifest/package.xml -o "$ORG_USER" -l "$TEST_LEVEL" ${TEST_NAMES:+-t "$TEST_NAMES"} --concise -w 120 2>&1 | tee validate_output.txt
            VALIDATE_EXIT=${PIPESTATUS[0]}
            [ $VALIDATE_EXIT -ne 0 ] && { echo "Validation failed during retry"; exit $VALIDATE_EXIT; }

            DEPLOY_ID=$(grep -m1 "Deploy ID:" validate_output.txt | awk '{print $3}')
            echo "New Deploy ID: $DEPLOY_ID"

            sf project deploy quick --target-org myOrg --job-id "$DEPLOY_ID" | tee quick_output.txt
            EXIT_CODE=${PIPESTATUS[0]}

            [ $EXIT_CODE -eq 0 ] && { echo "Deploy successful on retry $ATTEMPT"; exit 0; }
            echo "Retry $ATTEMPT failed, trying again..."
          done

          echo "Max retries reached. Deployment failed."
          exit 1

  deploy_prod:
    name: Deploy · PROD
    needs: validate_prod
    if: success() && github.event_name == 'workflow_dispatch' && inputs.target_branch == 'main'
    runs-on: ubuntu-latest
    container:
      image: salesforce/cli:2.130.9-slim
    environment: PROD
    continue-on-error: true
    env:
      CLIENT_ID: ${{ secrets.ClientIdProd }}
      CERTIFICATE: ${{ secrets.Certificado }}
      SF_USERNAME: ${{ secrets.UserNameProd }}
      LOGIN_URL: https://login.salesforce.com
      ORG_USER: ${{ secrets.UserNameProd }}
      TEST_LEVEL: ${{ inputs.test_level == 'none' && 'RunSpecifiedTests' || inputs.test_level == 'all' && 'RunLocalTests' || inputs.test_level == 'custom' && 'RunSpecifiedTests' || 'RunRelevantTests' }}
      TEST_NAMES: ${{ inputs.test_level == 'none' && secrets.DummyTest || inputs.test_level == 'custom' && inputs.test_names || '' }}
      DEPLOY_ID_FILE: deploy_id_prod.txt
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Descargar Deploy ID validado
        uses: actions/download-artifact@v4
        with:
          name: validate-prod

      - name: Login Salesforce
        shell: bash
        run: *login_script

      - name: 'Quick deploy con retry'
        shell: bash
        run: *deploy_script
